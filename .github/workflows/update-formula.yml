name: Update formula

on:
  repository_dispatch:
    types: [release]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update formula for new release
        run: python3 .github/scripts/update-formula.py "${{ github.event.client_payload.tag }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula
          git commit -m "Update homebrew-release-app to ${{ github.event.client_payload.tag }}"
          git push
